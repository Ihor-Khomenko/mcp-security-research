name: CI

on:
  push:
    branches: [main, "cursor/**", "wip/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests (network guarded)
        env:
          # Force offline-friendly defaults; conftest blocks real sockets.
          LLM_MAX_REQUESTS: "0"
          OPENAI_API_KEY: "test-not-used"
          OPENROUTER_API_KEY: "test-not-used"
          XAI_API_KEY: "test-not-used"
          GROQ_API_KEY: "test-not-used"
          ANTHROPIC_API_KEY: "test-not-used"
        run: |
          python -m pytest -q
